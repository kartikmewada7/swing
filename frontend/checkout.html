<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff5a1f"><title>Checkout — Foodie Express</title><link rel="stylesheet" href="css/style.css"></head><body><div id="navbar"></div><main class="section"><div class="container"><span class="eyebrow">ALMOST THERE</span><h1>Checkout</h1><p class="section-intro">Enter your delivery details and place your order.</p><div class="two-col"><form id="checkoutForm" class="panel form-grid"><h2>Delivery Details</h2><label>Name<input id="customerName" required autocomplete="name"></label><label>Mobile Number<input id="customerPhone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="tel"></label><label>Delivery Address<textarea id="customerAddress" required autocomplete="street-address" placeholder="House no., street, area, city…"></textarea></label><h3>Payment Method</h3><div class="payment-list"><label class="payment"><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label><label class="payment"><input type="radio" name="payment" value="Online"> Online Payment <small>(Demo)</small></label></div><button id="placeBtn" class="btn full" type="submit">Place Order →</button><p id="checkoutMessage" class="message"></p></form><aside id="checkoutSummary" class="panel summary"></aside></div></div></main><footer><div class="container footer-inner"><span>© 2026 Foodie Express</span><span>Fresh food • Fast delivery • Made with ❤️</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script></body></html>
