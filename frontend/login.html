<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff5a1f"><title>Login — Foodie Express</title><link rel="stylesheet" href="css/style.css"></head><body><div id="navbar"></div><main class="auth-wrap"><div class="container"><div class="auth-card"><div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="registerTab" type="button">Create Account</button></div><form id="loginForm" class="form-grid"><h2>Welcome back 👋</h2><p class="section-intro">Sign in to manage your cart and orders.</p><label>Email<input id="loginEmail" type="email" required autocomplete="email"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label><button class="btn full" type="submit">Login</button><p id="loginMessage" class="message"></p></form><form id="registerForm" class="form-grid hidden"><h2>Create your account</h2><p class="section-intro">Join Foodie Express in a minute.</p><label>Full Name<input id="registerName" required autocomplete="name"></label><label>Email<input id="registerEmail" type="email" required autocomplete="email"></label><label>Mobile Number<input id="registerPhone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="tel"></label><label>Password<input id="registerPassword" type="password" minlength="6" required autocomplete="new-password"></label><button class="btn full" type="submit">Create Account</button><p id="registerMessage" class="message"></p></form><form id="otpForm" class="form-grid hidden"><h2>Verify your email ✉️</h2><p class="section-intro">Enter the 6-digit OTP sent to <b id="otpEmail"></b>.</p><label>6-digit OTP<input id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button class="btn full" type="submit">Verify & Continue</button><button id="resendOtpBtn" class="btn secondary full" type="button">Resend OTP</button><p id="otpMessage" class="message"></p></form></div></div></main><footer><div class="container footer-inner"><span>© 2026 Foodie Express</span><span>Fresh food • Fast delivery • Made with ❤️</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script></body></html>
