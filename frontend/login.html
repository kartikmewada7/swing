<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="auth-page">
        <div class="auth-card">

            <div class="auth-tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="registerTab">Register</button>
            </div>

            <form id="loginForm">
                <h2>Welcome Back 👋</h2>

                <label>
                    Email
                    <input id="loginEmail" type="email" required>
                </label>

                <label>
                    Password
                    <input id="loginPassword" type="password" required>
                </label>

                <button class="btn full-width" type="submit">
                    Login
                </button>

                <p id="loginMessage" class="message"></p>
            </form>

            <form id="registerForm" class="hidden">
                <h2>Create Account</h2>

                <label>
                    Full Name
                    <input id="registerName" required>
                </label>

                <label>
                    Email
                    <input id="registerEmail" type="email" required>
                </label>

                <label>
                    Mobile Number
                    <input
                        id="registerPhone"
                        pattern="[0-9]{10}"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        id="registerPassword"
                        type="password"
                        minlength="6"
                        required
                    >
                </label>

                <button class="btn full-width" type="submit">
                    Send OTP
                </button>

                <p id="registerMessage" class="message"></p>
            </form>

            <form id="otpForm" class="hidden">
                <h2>Verify Email</h2>

                <p>
                    Enter the 6-digit OTP sent to your email.
                </p>

                <input
                    id="otp"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                    placeholder="123456"
                >

                <button class="btn full-width" type="submit">
                    Verify OTP
                </button>

                <button
                    id="resendOtp"
                    class="secondary-button full-width"
                    type="button"
                >
                    Resend OTP
                </button>

                <p id="otpMessage" class="message"></p>
            </form>

        </div>
    </main>

    <footer>© 2026 Foodie Express</footer>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/database.js"></script>

</body>
</html>
